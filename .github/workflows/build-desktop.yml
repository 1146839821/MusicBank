name: Build MusicBank desktop releases

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/build-desktop.yml'
      - 'scripts/verify-package.mjs'
      - 'package.json'
      - 'package-lock.json'
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: 22

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-15-intel is the Intel hosted runner.
          - name: macOS Intel
            id: macos-intel
            os: macos-15-intel
            platform: mac
            arch: x64
          # macos-15 is the Apple silicon hosted runner.
          - name: macOS Apple silicon
            id: macos-apple-silicon
            os: macos-15
            platform: mac
            arch: arm64
          - name: Windows x64
            id: windows-x64
            os: windows-2025
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build renderer and Electron main process
        run: npm run build

      - name: Package desktop application
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never

      - name: Verify packaged contents and native SQLite read/write
        run: node scripts/verify-package.mjs ${{ matrix.platform }} ${{ matrix.arch }} --smoke

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: musicbank-${{ matrix.id }}
          path: |
            release/*.dmg
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: musicbank-*
          path: release-assets
          merge-multiple: true

      - name: List release artifacts
        run: find release-assets -maxdepth 1 -type f -print

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "MusicBank ${GITHUB_REF_NAME}" \
            --generate-notes
